<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4 text-center">YouTube Video Awards</h1>
        <!-- Category: Best Meme -->
        <div class="card mb-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Best Meme</h4>
            </div>
            <div class="card-body">
                <div class="row g-4 align-items-center">
                    <div class="col-md-6">
                        <div class="ratio ratio-16x9 mb-2">
                            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Winner video" allowfullscreen></iframe>
                        </div>
                        <h6 class="text-success">Winner: Rick Astley</h6>
                    </div>
                    <div class="col-md-6">
                        <div class="ratio ratio-16x9 mb-2">
                            <iframe src="https://www.youtube.com/embed/J---aiyznGQ" title="Runner-up video" allowfullscreen></iframe>
                        </div>
                        <h6 class="text-secondary">Runner-up: Keyboard Cat</h6>
                    </div>
                </div>
            </div>
        </div>
        <!-- Category: Best Dance -->
        <div class="card mb-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Best Dance</h4>
            </div>
            <div class="card-body">
                <div class="row g-4 align-items-center">
                    <div class="col-md-6">
                        <div class="ratio ratio-16x9 mb-2">
                            <iframe src="https://www.youtube.com/embed/9bZkp7q19f0" title="Winner video" allowfullscreen></iframe>
                        </div>
                        <h6 class="text-success">Winner: PSY</h6>
                    </div>
                    <div class="col-md-6">
                        <div class="ratio ratio-16x9 mb-2">
                            <iframe src="https://www.youtube.com/embed/dTAAsCNK7RA" title="Runner-up video" allowfullscreen></iframe>
                        </div>
                        <h6 class="text-secondary">Runner-up: OK Go</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
