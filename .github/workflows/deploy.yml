name: Deploy MkDocs Material

on:
  push:
    branches:
      - main  # Trigger on push to main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # so we can use PAT manually

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Cache pip packages for faster deploys
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install MkDocs Material + plugin
      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material
          pip install mkdocs-git-revision-date-localized-plugin

      # Deploy site using PAT
      - name: Deploy MkDocs site
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdocs gh-deploy --force --remote-name https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
